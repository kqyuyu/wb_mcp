# Wildberries pagination patterns.
#
# WB uses two pagination styles:
#   1. next-cursor (GET /api/v3/orders, supplies, feedbacks pins, ...):
#      pass `next`=0 for the first page, then echo the `next` value returned
#      in the response body.
#   2. limit/offset (classic): `limit` = page size, `offset` = skip count.
#
# Each entry is a flat list item validated against PaginationPattern.
- operation_id: get_api_v3_orders
  type: cursor
  request_offset_field: next
  request_limit_field: limit
  response_items_field: orders
  response_total_field: next
  default_limit: 1000
  max_limit: 1000

